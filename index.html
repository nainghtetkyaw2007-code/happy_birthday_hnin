<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 19th Birthday Hnin Ei Hlaing!</title>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f7fa 0%, #80deea 50%, #4dd0e1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #004d40;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 150, 136, 0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #00838f;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        .step {
            display: none;
            animation: fadeIn 0.8s ease-in-out forwards;
        }
        .step.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn {
            background: linear-gradient(45deg, #00acc1, #26c6da);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 172, 193, 0.4);
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 20px rgba(0, 172, 193, 0.6);
        }
        .cake {
            font-size: 80px;
            margin: 15px 0;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        /* Photo Gallery Styling */
        .photo-card {
            background: #e0f2f1;
            padding: 20px;
            border-radius: 16px;
            border-top: 4px solid #00acc1;
            margin-top: 15px;
        }
        .gallery-img {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 12px;
            border: 3px solid #80deea;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 15px;
        }
        .wish-text {
            font-size: 1rem;
            line-height: 1.6;
            color: #004d40;
            font-weight: 500;
        }
        .slide-dots {
            margin-top: 10px;
            color: #00838f;
            font-size: 0.9rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- အဆင့် ၁ -->
        <div id="step1" class="step active">
            <h1>✨ Hello Hnin Ei Hlaing ✨</h1>
            <p>31.7.2026 မှာ ရောက်ရှိလာတဲ့ Special Birthday Surprise လေးတစ်ခု ရှိပါတယ်...</p>
            <button class="btn" onclick="nextStep(2)">Surprise ကို ဖွင့်ကြည့်ရန် 🎁</button>
        </div>

        <!-- အဆင့် ၂ -->
        <div id="step2" class="step">
            <h1>🎉 Happy 19th Birthday! 🎉</h1>
            <div class="cake">🎂</div>
            <p>၁၉ နှစ်ပြည့် မွေးနေ့ ဖယောင်းတိုင်လေး မီးမှုတ်ပြီး ဆုတောင်းလိုက်ရအောင်!</p>
            <button class="btn" onclick="nextStep(3)">ဖယောင်းတိုင် မီးမှုတ်မည် 🕯️</button>
        </div>

        <!-- အဆင့် ၃ - ဓာတ်ပုံ Gallery -->
        <div id="step3" class="step">
            <h1>💙 Happy Birthday Hnin Ei Hlaing 💙</h1>
            
            <div class="photo-card">
                <img id="currentImg" src="photo1.jpg" alt="Hnin Ei Hlaing" class="gallery-img">
                <p id="currentWish" class="wish-text">Happy 19th Birthday ပါ Hnin Ei Hlaing! 🌸</p>
                <div id="slideCounter" class="slide-dots">Photo 1 / 5</div>
            </div>

            <button id="nextPhotoBtn" class="btn" onclick="nextPhoto()">နောက်တစ်ပုံ ကြည့်ရန် ➔</button>
        </div>
    </div>

    <script>
        // ဓာတ်ပုံ ၅ ပုံနှင့် စာသားများ
        const galleryData = [
            { img: "photo1.jpg", text: "Happy 19th Birthday ပါ Hnin Ei Hlaing! 🌸" },
            { img: "photo2.jpg", text: "၃၁ ရက်၊ ၇ လပိုင်းမှာ ကျရောက်တဲ့ မွေးနေ့မှသည် စိတ်၏ချမ်းသာခြင်း၊ ကိုယ်၏ကျန်းမာခြင်းတို့နဲ့ ပြည့်စုံပါစေ။ ✨" },
            { img: "photo3.jpg", text: "လိုချင်တဲ့ အိမ်မက်တွေ၊ ရည်မှန်းချက်တွေအကုန် အမြန်ဆုံး အကောင်အထည်ဖော်နိုင်ပါစေ။ 💙" },
            { img: "photo4.jpg", text: "အမြဲတမ်း ပြုံးပြုံးရွှင်ရွှင်နဲ့ မိုးပြာရောင်လေးလို အေးချမ်းသာယာတဲ့ နေ့ရက်တွေကို ပိုင်ဆိုင်နိုင်ပါစေ! 🎈" },
            { img: "photo5.jpg", text: "ဘဝတစ်လျှောက်လုံး ပျော်ရွှင်စရာတွေနဲ့ပဲ အမြဲပြည့်နှက်နေပါစေလို့ ဆုတောင်းပေးပါတယ်! 🎉" }
        ];

        let currentIndex = 0;

        function nextStep(stepNumber) {
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
            });
            document.getElementById('step' + stepNumber).classList.add('active');
            
            if(stepNumber === 3) {
                triggerConfetti();
            }
        }

        function nextPhoto() {
            currentIndex++;
            if (currentIndex < galleryData.length) {
                document.getElementById('currentImg').src = galleryData[currentIndex].img;
                document.getElementById('currentWish').innerText = galleryData[currentIndex].text;
                document.getElementById('slideCounter').innerText = `Photo ${currentIndex + 1} / ${galleryData.length}`;
                
                // နောက်ဆုံးပုံရောက်ရင် Button စာသားပြောင်းမည်
                if (currentIndex === galleryData.length - 1) {
                    document.getElementById('nextPhotoBtn').innerText = "အောင်ပွဲခံ မီးပန်းများ ဖောက်မည် 🎊";
                }
            } else {
                triggerConfetti();
            }
        }

        function triggerConfetti() {
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
